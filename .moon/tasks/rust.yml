$schema: 'https://moonrepo.dev/schemas/tasks.json'
inheritedBy:
  language: 'rust'
fileGroups:
  sources: ['src/**/*', 'tests/**/*', 'Cargo.toml']
tasks:
  format:
    command: 'cargo fmt --check'
    inputs: ['@group(sources)']
  lint:
    command: 'cargo clippy --all-targets -- -D warnings'
    inputs: ['@group(sources)']
  test:
    command: 'cargo nextest run --no-tests=pass'
    inputs: ['@group(sources)']
  build:
    command: 'cargo build'
    inputs: ['@group(sources)']
