[workspace]
resolver = "3"
members = ["crates/*", "adapters/*", "xtask", "tests/e2e"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/E-Jacques/checkmate"

[workspace.dependencies]
checkmate-model = { path = "crates/model", version = "0.1.0" }
checkmate-registry = { path = "crates/registry", version = "0.1.0" }
checkmate-link = { path = "crates/link", version = "0.1.0" }
checkmate-check = { path = "crates/check", version = "0.1.0" }
checkmate-import = { path = "crates/import", version = "0.1.0" }
checkmate-publish = { path = "crates/publish", version = "0.1.0" }
checkmate-adapter-sdk = { path = "crates/adapter-sdk", version = "0.1.0" }
checkmate-config = { path = "crates/config", version = "0.1.0" }
checkmate-app = { path = "crates/app", version = "0.1.0" }
checkmate-lsp = { path = "crates/lsp", version = "0.1.0" }
checkmate-adapter-json = { path = "adapters/json", version = "0.1.0" }
checkmate-adapter-scan-fs = { path = "adapters/scan-fs", version = "0.1.0" }
checkmate-adapter-git = { path = "adapters/git", version = "0.1.0" }
checkmate-adapter-external = { path = "adapters/external", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tempfile = "3"
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
lto = "fat"
