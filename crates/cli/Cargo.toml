[package]
name = "rulelink-cli"
description = "Rulelink command line: the only executable of the product."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "rulelink"
path = "src/main.rs"

[features]
default = ["lsp"]
lsp = ["dep:rulelink-lsp"]

[lints]
workspace = true

[dependencies]
rulelink-app.workspace = true
clap.workspace = true
serde_json.workspace = true
rulelink-lsp = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "macros"] }
