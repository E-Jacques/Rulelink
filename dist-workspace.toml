# See docs/repository/02-release-lifecycle.md
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.28.0"
ci = "github"
# User-facing installers: shell, PowerShell and npm (ADR-0004). Homebrew and apt stay out of scope.
installers = ["shell", "powershell", "npm"]
npm-scope = "@rulelink-cli"
publish-jobs = ["npm"]
host-jobs = ["./smoke-test", "./docs-bundle"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Build checksums and GitHub build-provenance attestations for every artifact.
checksum = "sha256"
github-attestations = true

# dist 0.28 defaults its global jobs to ubuntu-20.04, which GitHub has retired (jobs never start).
[dist.github-custom-runners]
global = "ubuntu-latest"
