# Builds the public site and the crate reference into one folder when a GitHub release is
# published. Standalone on purpose: release.yml is generated by dist, so it must not carry
# this job. Nothing is deployed: the folder is uploaded as a workflow artifact, and the site
# is then uploaded by hand.
name: Docs bundle

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # Release notes are generated from the tags, so the full history is needed.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch --force --tags
      - uses: dtolnay/rust-toolchain@stable
      - uses: moonrepo/setup-toolchain@v0
      - run: cargo xtask release-notes
      # The site tasks are left out of `moon ci`, so the CI check has to be ignored here.
      - run: moon exec --ignore-ci-checks site:install site:build :api-docs :site-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: site-bundle
          path: target/site
          if-no-files-found: error
